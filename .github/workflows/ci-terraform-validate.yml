name: "CI: Terraform validate"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"

jobs:
  terraform-validate:
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-validate.yml@e63fdc45774e5963925b931238797256692cf040 # v1.2.0
    with:
      terraform_version: "1.13.3"
    secrets: inherit
